    sni: www,apple.comm
    description: "www,apple.com (测试借用站)"
    settings_snapshot:
      HEADER_TABLE_SIZE: 4096
      ENABLE_PUSH: 0
      MAX_CONCURRENT_STREAMS: 100
      INITIAL_WINDOW_SIZE: 65535
      MAX_FRAME_SIZE: 16384
      MAX_HEADER_LIST_SIZE: 16384
