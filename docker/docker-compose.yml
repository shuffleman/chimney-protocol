# Docker Compose for Chimney.
#
# Run from the repository root with:
#   docker compose -f docker/docker-compose.yml up --build relay
#
# Copy config/relay.yaml.example to config/relay.yaml before running.

version: '3.8'

services:
  relay:
    build:
      context: ..
      dockerfile: docker/Dockerfile.relay
    container_name: chimney-relay
    restart: unless-stopped
    ports:
      - "443:443"
      - "8080:8080"  # Metrics/health endpoint
    volumes:
      - ../config:/app/config:ro
      - ../profiles:/app/profiles:ro
    environment:
      - CHIMNEY_ADMIN_TOKEN=${CHIMNEY_ADMIN_TOKEN:-}
    command: ["-config", "/app/config/relay.yaml"]
    networks:
      - chimney-net
    # Security: run as non-root
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=10m

  # Client service (optional — usually runs locally)
  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    container_name: chimney-client
    restart: unless-stopped
    ports:
      - "127.0.0.1:1080:1080"  # SOCKS5 proxy
    environment:
      - CHIMNEY_RELAY=${CHIMNEY_RELAY:-relay.example.com:443}
      - CHIMNEY_SNI=${CHIMNEY_SNI:-real-site.example.com}
      - CHIMNEY_DEST=${CHIMNEY_DEST:-127.0.0.1:1}
      - CHIMNEY_USER_ID=${CHIMNEY_USER_ID:-your-uuid-here}
      - CHIMNEY_PSK=${CHIMNEY_PSK:-}
    command: [
      "-relay", "${CHIMNEY_RELAY:-relay.example.com:443}",
      "-sni", "${CHIMNEY_SNI:-real-site.example.com}",
      "-dest", "${CHIMNEY_DEST:-127.0.0.1:1}",
      "-user-id", "${CHIMNEY_USER_ID:-your-uuid-here}",
      "-listen", "0.0.0.0:1080"
    ]
    networks:
      - chimney-net
    profiles:
      - client  # Only start when explicitly requested

networks:
  chimney-net:
    driver: bridge
